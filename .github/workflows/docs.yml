name: Docs

# Mintlify builds and hosts the site from this repository on its own; this
# workflow only checks that it will build and mirrors every push to CNB.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # notifications.json, mint validate, mint broken-links
      - run: pnpm check

  # GitLab and git.lin.pub pull from GitHub on their own; CNB has no pull
  # mirror, so every push is forwarded there. The installers are served from
  # CNB's raw files (see the redirects in docs.json), so main must reach it.
  mirror-cnb:
    name: Mirror to CNB
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        run: |
          if [ -z "$CNB_TOKEN" ]; then echo "CNB_TOKEN is empty; skipping"; exit 0; fi
          auth="$(printf 'cnb:%s' "$CNB_TOKEN" | base64 -w0)"
          git -c credential.helper= -c "http.https://cnb.cool/.extraheader=Authorization: Basic $auth" \
            push --force https://cnb.cool/LeenHawk/gproxy-docs.git "$GITHUB_SHA:refs/heads/$GITHUB_REF_NAME"
          # CNB is a push mirror; deleting dev on GitHub does not remove it there.
          retired_dev="$(git -c credential.helper= -c "http.https://cnb.cool/.extraheader=Authorization: Basic $auth" \
            ls-remote https://cnb.cool/LeenHawk/gproxy-docs.git refs/heads/dev | cut -f1)"
          if [ -n "$retired_dev" ]; then
            git -c credential.helper= -c "http.https://cnb.cool/.extraheader=Authorization: Basic $auth" \
              push --force-with-lease="refs/heads/dev:$retired_dev" https://cnb.cool/LeenHawk/gproxy-docs.git :refs/heads/dev
          fi
